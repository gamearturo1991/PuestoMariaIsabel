<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<h:head>

    <h:outputStylesheet library="css" name="style.css" />

    <script>

        function togglePassword() {
            var input = document.getElementById('loginForm:pwdInput');
            var texto = document.getElementById('toggleText');
            if (input.type === "password") {
                input.type = "text";
                texto.innerHTML = "Ocultar";
            } else {
                input.type = "password";
                texto.innerHTML = "Mostrar";
            }
        }
    </script>
</h:head>

<h:body>
    <div class="login-card">

        <div class="logo-placeholder">
        </div>

        <h2 class="login-title">Iniciar sesión</h2>
        <p class="login-subtitle">Punto de venta e inventario</p>

        <h:form id="loginForm">
            <p:messages id="messages" showDetail="true" closable="true" />

            <div class="form-group">
                <label>Usuario</label>
                <p:inputText id="userInput" class="form-control custom-input" autocomplete="false" value="#{loginUI.usuario.nombreUsuario}" />
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <div class="password-wrapper">
                    <p:password id="pwdInput" class="form-control custom-input" value="#{loginUI.usuario.contrasenaHash}" />
                    <span id="toggleText" class="show-password-text" onclick="togglePassword()">Mostrar</span>
                </div>
            </div>

            <div class="btn-wrapper">


                <p:commandButton update="messages" class="custom-btn" value="Entrar" action="#{loginUI.login()}" />

                <div class="btn-subtext-overlay">
                    Solo personal autorizado. Los cambios quedan<br/>registrados en la bitácora.
                </div>
            </div>
        </h:form>

    </div>
</h:body>
</html>
